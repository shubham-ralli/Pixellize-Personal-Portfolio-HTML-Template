<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Something new is coming soon — Pixellize." />
  <title>Coming Soon · Pixellize</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#c4f135" /><link rel="stylesheet" href="assets/css/style.css" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", t);
        var a = localStorage.getItem("accent"); if (a && a !== "lime") document.documentElement.setAttribute("data-accent", a);
        if (localStorage.getItem("dir") === "rtl") document.documentElement.setAttribute("dir", "rtl");
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ===== Minimal header ===== -->
  <header class="site-header scrolled" id="header">
    <div class="container nav-inner">
      <a href="index.html" class="brand">Pixel<span>lize</span></a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">Home</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode">
          <span class="ic-moon">☾</span><span class="ic-sun">☀</span>
        </button>
      </nav>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===== Coming soon ===== -->
  <section class="util-page">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="util-inner">
      <span class="hero-chip util-chip"><i class="hero-dot"></i> Launching soon</span>
      <h1 style="font-size: clamp(2.2rem, 6vw, 3.6rem); margin-bottom: 16px;">Something great is <span class="hero-name">coming soon</span></h1>
      <p>I'm putting the finishing touches on something new. Drop your email and I'll let you know the moment it goes live.</p>

      <div class="countdown" id="countdown" data-date="2026-12-31T00:00:00">
        <div class="cd-box"><strong id="cd-d">00</strong><span>Days</span></div>
        <div class="cd-box"><strong id="cd-h">00</strong><span>Hours</span></div>
        <div class="cd-box"><strong id="cd-m">00</strong><span>Minutes</span></div>
        <div class="cd-box"><strong id="cd-s">00</strong><span>Seconds</span></div>
      </div>

      <form class="notify-form" id="notifyForm" novalidate>
        <input type="email" id="notifyEmail" placeholder="Enter your email" aria-label="Email address" />
        <button type="submit" class="btn">Notify Me</button>
      </form>
      <p class="notify-note" id="notifyNote" role="status"></p>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="index.html" class="brand">Pixel<span>lize</span></a>
      <p>© <span id="year"></span> Alex Carter. All rights reserved.</p>
      <a href="#" class="to-top" aria-label="Back to top">↑</a>
    </div>
  </footer>

  <!-- Style switcher (accent demo) -->
  <div class="style-switcher" id="styleSwitcher">
    <button type="button" class="ss-toggle" id="ssToggle" aria-label="Open style switcher" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1.5" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1.5" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1.5" fill="currentColor"/><path d="M12 2a10 10 0 100 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1.1.9-2 2-2h1.5A4.5 4.5 0 0022 11 10 10 0 0012 2z"/></svg>
    </button>
    <div class="ss-panel">
      <p class="ss-title">Accent Color</p>
      <div class="ss-swatches">
        <button type="button" class="ss-swatch active" data-accent="lime" style="--sw:#c4f135" aria-label="Lime"></button>
        <button type="button" class="ss-swatch" data-accent="blue" style="--sw:#4d8dff" aria-label="Blue"></button>
        <button type="button" class="ss-swatch" data-accent="purple" style="--sw:#a97bff" aria-label="Purple"></button>
      </div>
      <p class="ss-title" style="margin-top:16px;">Direction</p>
      <div class="ss-dirs">
        <button type="button" class="ss-dir active" data-dir="ltr">LTR</button>
        <button type="button" class="ss-dir" data-dir="rtl">RTL</button>
      </div>
    </div>
  </div><script src="assets/js/main.js"></script>
</body>
</html>
